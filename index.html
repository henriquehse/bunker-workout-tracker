<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Workout Tracker — Treinos gerados pelo Bunker, acompanhamento de fitness pessoal." />
  <title>Bunker Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <h1 class="brand-name">Workout Tracker</h1>
          <span class="brand-sub">by Bunker</span>
        </div>
      </div>
      <div class="header-stats" id="header-stats">
        <!-- Populated by JS -->
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- LOADING STATE -->
    <div class="loading" id="loading">
      <div class="pulse-ring"></div>
      <p>Carregando treinos...</p>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">🏋️</div>
      <h2>Nenhum treino ainda</h2>
      <p>Gere um treino no Bunker e salve-o para acompanhar aqui.</p>
    </div>

    <!-- STATS OVERVIEW -->
    <section class="stats-grid" id="stats-grid" style="display:none">
      <div class="stat-card" id="stat-total">
        <span class="stat-value" id="val-total">0</span>
        <span class="stat-label">Treinos</span>
      </div>
      <div class="stat-card" id="stat-streak">
        <span class="stat-value" id="val-streak">0</span>
        <span class="stat-label">Dias de streak 🔥</span>
      </div>
      <div class="stat-card" id="stat-calories">
        <span class="stat-value" id="val-calories">0</span>
        <span class="stat-label">kcal totais</span>
      </div>
      <div class="stat-card" id="stat-duration">
        <span class="stat-value" id="val-duration">0</span>
        <span class="stat-label">Minutos totais</span>
      </div>
    </section>

    <!-- LATEST WORKOUT -->
    <section class="section" id="latest-section" style="display:none">
      <h2 class="section-title">
        <span class="title-icon">⚡</span>
        Último Treino
      </h2>
      <div id="latest-workout"></div>
    </section>

    <!-- WORKOUT HISTORY -->
    <section class="section" id="history-section" style="display:none">
      <h2 class="section-title">
        <span class="title-icon">📅</span>
        Histórico
      </h2>
      <div id="history-list"></div>
    </section>

  </main>

  <footer class="footer">
    <p>🏰 Bunker Workout Tracker — Atualizado automaticamente pelo Bunker</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
